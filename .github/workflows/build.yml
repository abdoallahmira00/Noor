name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          mkdir www && cp index.html www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          echo '{"appId":"com.noor.prayer","appName":"نور","webDir":"www"}' > capacitor.config.json
          npx cap add android
          python3 - <<'EOF'
          p="android/app/src/main/AndroidManifest.xml"
          s=open(p,encoding="utf8").read()
          names=["ACCESS_FINE_LOCATION","ACCESS_COARSE_LOCATION","POST_NOTIFICATIONS","SCHEDULE_EXACT_ALARM","USE_EXACT_ALARM","VIBRATE","RECEIVE_BOOT_COMPLETED"]
          perms="".join('<uses-permission android:name="android.permission.%s"/>\n'%x for x in names)
          s=s.replace("<application",perms+"<application",1)
          open(p,"w",encoding="utf8").write(s)
          EOF
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: noor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
